<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch Streaks — Twitch-Channel-Points-Miner-v2</title>
    <link rel="icon" type="image/png" sizes="32x32"
        href="https://static.twitchcdn.net/assets/favicon-32-e29e246c157142c94346.png">
    <link rel="icon" type="image/png" sizes="16x16"
        href="https://static.twitchcdn.net/assets/favicon-16-52e571ffea063af7a7f4.png">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.6.1/css/bulma.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet"
        integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link href="{{url_for('static', filename='dark-theme.css')}}" rel="stylesheet" />
    <link href="{{url_for('static', filename='style.css')}}" rel="stylesheet" />

    <style>
        .streak-table td, .streak-table th { vertical-align: middle; }
        .dot { height: 0.7rem; width: 0.7rem; border-radius: 50%; display: inline-block; }
        .dot-on { background: #23d160; }
        .dot-off { background: #b5b5b5; }
        .badge {
            font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600;
        }
        .b-earned { background: #23d160; color: #fff; }
        .b-pending { background: #ffdd57; color: #3a3a1a; }
        .b-offline { background: #dbdbdb; color: #7a7a7a; }
        .b-on { background: #3273dc; color: #fff; }
        .b-no { background: #dbdbdb; color: #7a7a7a; }
        .muted { color: #9a9a9a; }
        .feed { list-style: none; margin: 0; padding: 0; }
        .feed li {
            padding: 0.5rem 0.75rem; border-bottom: 1px solid #ededed;
            font-size: 0.9rem; display: flex; gap: 0.6rem; align-items: baseline;
        }
        .feed .ts { color: #9a9a9a; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .feed .who { font-weight: 600; min-width: 8rem; }
        .dark-mode .streak-table, .dark-mode .box { background: #2b2b3b; color: #f5f5f5; }
        .dark-mode .feed li { border-color: #444; }
        .s-queued { color: #3273dc; }
        .s-recovering { color: #ff9f1a; }
        .s-recovered { color: #23d160; font-weight: 600; }
        .s-sent { color: #c9a227; }
        .s-no_vod { color: #ff3860; }
    </style>
</head>

<body>
    <div class="container" style="max-width: 820px; padding: 1.5rem;">
        <div class="has-text-centered" style="margin-bottom: 1rem;">
            <a href="/"><img style="max-width: 500px; width: 100%;"
                src="{{url_for('static', filename='banner.png')}}" alt="banner"></a>
        </div>

        <div style="margin-bottom: 0.75rem;">
            <a href="/" class="has-text-grey">
                <span class="icon"><i class="fas fa-arrow-left"></i></span>
                <span>Back to dashboard</span>
            </a>
        </div>

        <p class="title is-5" style="margin-bottom: 0.2rem;">Watch Streaks</p>
        <p class="subtitle is-6">Per-streamer streak status and VOD-recovery activity. Auto-refreshes.</p>

        <div class="box" style="padding: 0.75rem;">
            <table class="table is-fullwidth is-narrow streak-table">
                <thead>
                    <tr>
                        <th>Streamer</th>
                        <th class="has-text-centered">Live</th>
                        <th class="has-text-centered">Streak</th>
                        <th class="has-text-right">Watched</th>
                        <th class="has-text-centered">VOD recovery</th>
                    </tr>
                </thead>
                <tbody id="streak-body">
                    <tr><td colspan="5" class="muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>

        <p class="title is-6" style="margin: 1.25rem 0 0.4rem;">Recovery activity</p>
        <div class="box" style="padding: 0.25rem 0;">
            <ul class="feed" id="activity-feed">
                <li class="muted">Loading…</li>
            </ul>
        </div>
        <p id="status-msg" class="muted" style="margin-top: 0.6rem; font-size: 0.85rem;"></p>
    </div>

    <script>
        function applyDarkMode() {
            if (localStorage.getItem("dark-mode") === "true") {
                document.body.classList.add("dark-mode");
            }
        }
        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function(c) {
                return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
            });
        }
        function statusBadge(s) {
            if (s === "earned") return '<span class="badge b-earned">earned</span>';
            if (s === "pending") return '<span class="badge b-pending">at&nbsp;risk</span>';
            return '<span class="badge b-offline">offline</span>';
        }
        function fmtTime(ts) {
            const d = new Date(ts * 1000);
            return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
        }
        function renderStreamers(rows) {
            const body = document.getElementById("streak-body");
            if (!rows.length) { body.innerHTML = '<tr><td colspan="5" class="muted">No streamers.</td></tr>'; return; }
            // Online first, then pending/earned, then offline; stable otherwise
            rows.sort(function(a, b) { return (b.is_online - a.is_online); });
            body.innerHTML = rows.map(function(r) {
                const dot = r.is_online ? '<span class="dot dot-on"></span>' : '<span class="dot dot-off"></span>';
                const recov = r.vod_recovery ? '<span class="badge b-on">on</span>'
                    : '<span class="badge b-no">off</span>';
                const watched = r.is_online ? (r.minute_watched + "m") : '<span class="muted">—</span>';
                return '<tr>' +
                    '<td>' + escapeHtml(r.username) + '</td>' +
                    '<td class="has-text-centered">' + dot + '</td>' +
                    '<td class="has-text-centered">' + statusBadge(r.status) + '</td>' +
                    '<td class="has-text-right">' + watched + '</td>' +
                    '<td class="has-text-centered">' + recov + '</td>' +
                    '</tr>';
            }).join("");
        }
        function renderActivity(items) {
            const feed = document.getElementById("activity-feed");
            if (!items.length) {
                feed.innerHTML = '<li class="muted">No recovery activity yet. ' +
                    'Entries appear when a watch-streak streamer goes offline before being watched live.</li>';
                return;
            }
            feed.innerHTML = items.map(function(it) {
                const detail = it.detail ? '<span class="muted">' + escapeHtml(it.detail) + '</span>' : '';
                return '<li>' +
                    '<span class="ts">' + fmtTime(it.ts) + '</span>' +
                    '<span class="who">' + escapeHtml(it.username) + '</span>' +
                    '<span class="s-' + escapeHtml(it.status) + '">' + escapeHtml(it.status) + '</span>' +
                    detail +
                    '</li>';
            }).join("");
        }
        function load() {
            fetch("/streaks/data")
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    renderStreamers(d.streamers || []);
                    renderActivity(d.activity || []);
                    document.getElementById("status-msg").textContent =
                        "Updated " + new Date().toLocaleTimeString();
                })
                .catch(function(e) {
                    document.getElementById("status-msg").textContent = "Error: " + e.message;
                });
        }
        applyDarkMode();
        load();
        setInterval(load, 10000);
    </script>
</body>

</html>
